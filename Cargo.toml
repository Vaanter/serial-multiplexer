[workspace.package]
authors = ["Valentín Bolfík <valentin.bolfik@gmail.com>"]
version = "0.8.3"
edition = "2024"

[workspace]
resolver = "3"
members = [
    "crates/cli",
    "crates/config",
    "crates/shared"
]

[profile.release]
lto = "fat"
codegen-units = 1
debug = "full"
strip = "debuginfo"
opt-level = 3
incremental = true

[workspace.dependencies]
anyhow = "1.0.102"
async-broadcast = "0.7.2"
async-channel = "2.5.0"
bytes = "1.12.0"
clap = { version = "4.6.1", features = ["derive"] }
figment = { version = "0.10.19", features = ["toml", "env"] }
futures = "0.3.32"
http = "1.4.2"
http-body-util = "0.1.3"
hyper = { version = "1.10.1", features = ["http1", "client", "server"] }
hyper-util = { version = "0.1.20", features = ["http1", "tokio"] }
mimalloc = "0.1.52"
papaya = "0.2.4"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.52.3", features = ["full", "test-util"] }
tokio-serial = "5.5.0"
tokio-util = "0.7.18"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-attributes = "0.1.31"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

fast-socks5 = "1.0.0"
flatbuffers = "25.12.19"
memchr = "2.8.2"
zeroize = "1.9.0"
zstd-safe = { version = "7.2.4", features = ["std"] }
